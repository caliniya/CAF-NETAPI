<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CAF 时间接口">
  <title>CAF NETAPI</title>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>CAF <span>NETAPI</span></h1>
      <a href="https://github.com/caliniya/CAF-NETAPI" target="_blank" rel="noopener noreferrer">GitHub</a>
    </header>

    <section class="panel" aria-labelledby="title">
      <div class="row">
        <h2 id="title">时间接口</h2>
        <span id="status" class="status" data-state="loading" role="status">正在同步</span>
      </div>
      <p class="muted">UTC · 零时区</p>
      <time id="clock" class="clock">--:--:--</time>
      <p id="utc-date" class="date">---- / -- / --</p>
      <p class="local-time">本机时区 <span id="local-clock">—</span></p>
      <button id="refresh" class="primary" type="button">重新同步</button>

      <div class="api">
        <span class="method">GET</span>
        <div class="row">
          <a id="endpoint" href="/api/time" target="_blank" rel="noopener">/api/time</a>
          <button id="copy" type="button">复制地址</button>
        </div>
        <p class="muted">返回 UTC 时间和 Unix 毫秒时间戳。</p>
      </div>
      <noscript><p class="muted">启用 JavaScript 可显示时间，或直接打开接口地址。</p></noscript>
    </section>
  </main>
</body>
</html>
